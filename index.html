<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PhonePe Payment Confirmation</title>
  <style>
    /* Global Reset & Base Styling */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f1ecf9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* Main Card Container */
    .payment-card {
      background-color: #ffffff;
      width: 100%;
      max-width: 380px;
      border-radius: 18px;
      box-shadow: 0 10px 28px rgba(95, 37, 159, 0.15);
      overflow: hidden;
      border: 1px solid #e5daf3;
    }

    /* Header with PhonePe Brand Colors */
    .card-header {
      background-color: #5f259f;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* PhonePe Logo Branding */
    .brand-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #ffffff;
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .pe-circle {
      width: 28px;
      height: 28px;
      background-color: #ffffff;
      color: #5f259f;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 900;
    }

    .badge {
      background-color: rgba(255, 255, 255, 0.2);
      color: #ffffff;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      letter-spacing: 0.4px;
    }

    /* Card Content Area */
    .card-body {
      padding: 24px 20px 20px;
      text-align: center;
    }

    /* Success Icon */
    .success-icon {
      width: 60px;
      height: 60px;
      background-color: #1da862;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 14px;
      box-shadow: 0 4px 14px rgba(29, 168, 98, 0.35);
      border: 4px solid #e3f7ed;
    }

    .success-icon svg {
      width: 32px;
      height: 32px;
      stroke: #ffffff;
      stroke-width: 3.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Payment Status & Amount */
    .status-title {
      font-size: 16px;
      color: #1da862;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .amount {
      font-size: 34px;
      font-weight: 800;
      color: #212121;
      margin-bottom: 12px;
    }

    .recipient-intro {
      font-size: 13px;
      color: #666666;
      margin-bottom: 2px;
    }

    .recipient-name {
      font-size: 17px;
      font-weight: 700;
      color: #2c0e4f;
    }

    .recipient-upi {
      font-size: 13px;
      color: #7b7b7b;
      margin-top: 2px;
      margin-bottom: 18px;
    }

    /* Bank Account Card */
    .bank-box {
      background-color: #faf7fd;
      border: 1px solid #ebdff8;
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: left;
      margin-bottom: 20px;
    }

    .bank-logo {
      width: 38px;
      height: 38px;
      background-color: #5f259f;
      color: #ffffff;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: bold;
      flex-shrink: 0;
    }

    .bank-details .bank-title {
      font-size: 13px;
      font-weight: 700;
      color: #212121;
    }

    .bank-details .bank-account {
      font-size: 12px;
      color: #6d6d6d;
    }

    /* Ticket Divider with Side Cutout Circles */
    .dashed-divider {
      border-top: 1.5px dashed #d5c3ea;
      margin: 18px -20px;
      position: relative;
    }

    .dashed-divider::before,
    .dashed-divider::after {
      content: "";
      position: absolute;
      top: -8px;
      width: 14px;
      height: 14px;
      background-color: #f1ecf9;
      border-radius: 50%;
    }

    .dashed-divider::before {
      left: -7px;
    }

    .dashed-divider::after {
      right: -7px;
    }

    /* Transaction Details */
    .transaction-details {
      width: 100%;
      margin-top: 10px;
      text-align: left;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      font-size: 12.5px;
    }

    .detail-label {
      color: #6e6e6e;
    }

    .detail-value {
      color: #1f1f1f;
      font-weight: 600;
      word-break: break-all;
    }

    /* Action Buttons */
    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .btn {
      flex: 1;
      padding: 11px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s ease;
      text-align: center;
    }

    .btn-outline {
      background-color: #ffffff;
      color: #5f259f;
      border-color: #5f259f;
    }

    .btn-outline:hover {
      background-color: #f6f0fc;
    }

    .btn-filled {
      background-color: #5f259f;
      color: #ffffff;
    }

    .btn-filled:hover {
      background-color: #4b1b80;
    }

    /* Card Footer */
    .card-footer {
      background-color: #fbf9fe;
      border-top: 1px solid #ebdff8;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: #695e76;
    }

    .upi-badge {
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #5f259f;
    }

    .upi-badge span {
      color: #212121;
    }

    .security-note {
      display: flex;
      align-items: center;
      gap: 4px;
      color: #524760;
    }
  </style>
</head>
<body>

  <!-- PhonePe Payment Confirmation Card -->
  <div class="payment-card">

    <!-- Header -->
    <div class="card-header">
      <div class="brand-logo">
        <div class="pe-circle">&#2346;&#2375;</div>
        PhonePe
      </div>
      <span class="badge">UPI Payment</span>
    </div>

    <!-- Main Content -->
    <div class="card-body">
      <!-- Success Icon -->
      <div class="success-icon">
        <svg viewBox="0 0 24 24">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </div>

      <h2 class="status-title">Transaction Successful</h2>
      <div class="amount">&#8377;500.00</div>

      <p class="recipient-intro">Paid to</p>
      <div class="recipient-name">Sharma General Store</div>
      <div class="recipient-upi">sharmastore@ybl</div>

      <!-- Debited Bank Info -->
      <div class="bank-box">
        <div class="bank-logo">SBI</div>
        <div class="bank-details">
          <div class="bank-title">State Bank of India</div>
          <div class="bank-account">Debited from A/C No. &bull;&bull;&bull;&bull; 4821</div>
        </div>
      </div>

      <!-- Ticket Notch Divider -->
      <div class="dashed-divider"></div>

      <!-- Transaction Details -->
      <div class="transaction-details">
        <div class="detail-row">
          <span class="detail-label">UPI Ref ID (UTR)</span>
          <span class="detail-value">426391058291</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Transaction ID</span>
          <span class="detail-value">T260919212716123456</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Date & Time</span>
          <span class="detail-value">19 Sep 2026, 09:27 PM</span>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="button-group">
        <button class="btn btn-outline" type="button">Share Receipt</button>
        <button class="btn btn-filled" type="button">Done</button>
      </div>
    </div>

    <!-- Footer -->
    <div class="card-footer">
      <div class="upi-badge">POWERED BY <span>UPI</span></div>
      <div class="security-note">&#128274; 100% Safe &amp; Secure</div>
    </div>

  </div>

</body>
</html>
